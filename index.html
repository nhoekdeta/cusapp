<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer 360 Prototype</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23FF9F18'/%3E%3Cstop%20offset='1'%20stop-color='%23F56300'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='url(%23g)'/%3E%3Ccircle%20cx='11'%20cy='12'%20r='3'%20fill='%23fff'/%3E%3Ccircle%20cx='21'%20cy='12'%20r='3'%20fill='%23fff'%20fill-opacity='.55'/%3E%3Crect%20x='8'%20y='19'%20width='16'%20height='3.4'%20rx='1.7'%20fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* ===== clean & minimal — near-white surfaces, hairline borders, soft shadows,
           Cellcard orange only on the active section and primary actions ===== */
  :root{
    --bg:#fbf8f4; --surface:#ffffff; --surface-2:#f7f3ee; --surface-3:#eeeae3;
    --border:#e4e2e6; --border-strong:#c9c7cd;
    --ink:#191a1c; --ink-2:#3d3e44; --ink-3:#5f6069;
    --brand:#ff9f18;
    --accent:#f56300; --accent-2:#dd5800; --accent-text:#b34a00;
    --accent-soft:#ffe9d2; --accent-ink:#ffffff;
    --pop:#c3126f; --pop-soft:#fbe1ef;
    --good-bg:#e4f3ea; --good-fg:#186b3b; --good-dot:#26a15a;
    --warn-bg:#f9edd4; --warn-fg:#7c4f06; --warn-dot:#c98a1e;
    --bad-bg:#fbe5e1;  --bad-fg:#b3352b;  --bad-dot:#df5140;
    --info-bg:#e0f0fa; --info-fg:#0a6a99; --info-dot:#0d90ce;
    --radius:10px; --radius-sm:7px;
    --shadow:0 1px 2px rgba(25,20,10,.06), 0 1px 3px rgba(25,20,10,.05);
    --shadow-sm:0 1px 2px rgba(25,20,10,.06);
    --grad:linear-gradient(140deg,#ff9f18 0%,#f56300 100%);
    --font:'IBM Plex Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Khmer OS",sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#111112; --surface:#1a1a1d; --surface-2:#202024; --surface-3:#2a2a2f;
      --border:#333339; --border-strong:#48484f;
      --ink:#f1f1f3; --ink-2:#c4c4cb; --ink-3:#9a9aa3;
      --brand:#ffab3d;
      --accent:#ff8a2a; --accent-2:#ff9f18; --accent-text:#ffab5c;
      --accent-soft:#3b2410; --accent-ink:#1c0e00;
      --pop:#f072b0; --pop-soft:#3a1a2c;
      --good-bg:#16311f; --good-fg:#5fca88; --good-dot:#34ac68;
      --warn-bg:#332811; --warn-fg:#e2b464; --warn-dot:#d09a2e;
      --bad-bg:#341d19;  --bad-fg:#f0958c;  --bad-dot:#df6152;
      --info-bg:#122c3d; --info-fg:#6fc0e8; --info-dot:#2ba0d8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 2px 8px -1px rgba(0,0,0,.4);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --grad:linear-gradient(140deg,#ffb040 0%,#ff8a2a 100%);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111112; --surface:#1a1a1d; --surface-2:#202024; --surface-3:#2a2a2f;
    --border:#333339; --border-strong:#48484f;
    --ink:#f1f1f3; --ink-2:#c4c4cb; --ink-3:#9a9aa3;
    --brand:#ffab3d;
    --accent:#ff8a2a; --accent-2:#ff9f18; --accent-text:#ffab5c;
    --accent-soft:#3b2410; --accent-ink:#1c0e00;
    --pop:#f072b0; --pop-soft:#3a1a2c;
    --good-bg:#16311f; --good-fg:#5fca88; --good-dot:#34ac68;
    --warn-bg:#332811; --warn-fg:#e2b464; --warn-dot:#d09a2e;
    --bad-bg:#341d19;  --bad-fg:#f0958c;  --bad-dot:#df6152;
    --info-bg:#122c3d; --info-fg:#6fc0e8; --info-dot:#2ba0d8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 2px 8px -1px rgba(0,0,0,.4);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --grad:linear-gradient(140deg,#ffb040 0%,#ff8a2a 100%);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;}
  html,body{margin:0;padding:0;color:var(--ink);}
  body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;background:var(--bg);}
  *{border-color:var(--border);}
  ::selection{background:var(--accent-soft);}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.011em;text-wrap:balance;color:var(--ink);}
  a{color:var(--accent-text);font-weight:500;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .num{font-variant-numeric:tabular-nums;}
  .eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.09em;font-size:10.5px;font-weight:500;color:var(--ink-2);}
  .muted{color:var(--ink-2);}
  .mini{font-size:11.5px;color:var(--ink-2);}

  /* shell */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:212px;flex:none;display:flex;flex-direction:column;gap:2px;padding:16px 12px;
    border-right:1px solid var(--border);background:var(--surface);position:sticky;top:0;height:100vh;overflow-y:auto;}
  .side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;margin-bottom:8px;border-bottom:1px solid var(--border);}
  .side-brand .logo{width:28px;height:28px;border-radius:7px;background:var(--grad);color:#fff;flex:none;
    display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:-.02em;box-shadow:var(--shadow-sm);}
  .side-brand .name{font-weight:600;font-size:13px;line-height:1.2;}
  .side-brand .sub{font-size:10px;color:var(--ink-2);margin-top:1px;}
  .side-nav{display:flex;flex-direction:column;gap:1px;}
  .nav-btn{appearance:none;border:0;background:transparent;font:inherit;cursor:pointer;text-align:left;width:100%;
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);
    font-size:12.5px;font-weight:500;transition:background .13s,color .13s;}
  .nav-btn svg{width:16px;height:16px;flex:none;stroke:currentColor;opacity:.72;}
  .nav-btn:hover{background:var(--surface-3);color:var(--ink);}
  .nav-btn[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600;}
  .nav-btn[aria-selected="true"] svg{opacity:1;}
  .nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .navbadge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center;line-height:1.5;}
  .nav-btn[aria-selected="true"] .navbadge{background:var(--accent-text);}
  .side-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--border);
    font-size:10.5px;line-height:1.7;color:var(--ink-2);}
  .side-foot button{background:none;border:0;font:inherit;font-size:10.5px;color:var(--accent-text);font-weight:600;cursor:pointer;padding:0;margin-top:4px;}
  .side-foot button:hover{text-decoration:underline;}

  .content{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 22px;border-bottom:1px solid var(--border);background:var(--surface);}
  .topbar h1{font-size:15px;letter-spacing:-.011em;font-weight:600;line-height:1.25;}
  .topbar .persona{font-size:11px;color:var(--ink-2);margin-top:2px;}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .mobilenav{display:none;}

  main{max-width:1400px;width:100%;margin:0 auto;padding:20px 22px 84px;}
  .panel{display:flex;flex-direction:column;gap:20px;}
  @media (prefers-reduced-motion:no-preference){
    .panel{animation:fade .16s ease;}
    @keyframes fade{from{opacity:.5;}to{opacity:1;}}
  }
  .panel-head p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:78ch;line-height:1.65;}

  @media (max-width:880px){
    .sidebar{display:none;}
    .topbar{gap:10px;padding:13px 18px;}
    .mobilenav{display:flex;gap:6px;overflow-x:auto;width:100%;order:5;padding-top:6px;}
    .mobilenav .nav-btn{width:auto;padding:7px 13px;border-radius:8px;background:var(--surface-2);white-space:nowrap;}
    .mobilenav .nav-btn svg,.mobilenav .navbadge{display:none;}
    .mobilenav .nav-btn[aria-selected="true"]{background:var(--accent-soft);}
    main{padding:20px 15px 80px;}
  }

  /* cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .card-head{padding:15px 18px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .card-head h2{font-size:14px;font-weight:600;}
  .card-head p{margin:3px 0 0;font-size:12px;color:var(--ink-2);}
  .card-body{padding:18px;}
  .grid{display:grid;gap:16px;}
  .g2{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  .split{display:flex;gap:20px;align-items:flex-start;}
  .split > .col-main{flex:1;min-width:0;}
  .split > .col-side{width:330px;flex:none;position:sticky;top:74px;align-self:flex-start;}
  @media (max-width:920px){ .split > .col-side{position:static;} }
  @media (max-width:1000px){ .g4{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:920px){
    .g2,.g3{grid-template-columns:1fr;}
    .split{flex-direction:column;} .split > .col-side{width:100%;}
  }
  @media (max-width:560px){ .g4{grid-template-columns:1fr;} }

  /* tables */
  .twrap{overflow-x:auto;}
  table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
  table.tbl th{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:500;
    color:var(--ink-2);text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;}
  table.tbl td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.tbl tr:last-child td{border-bottom:0;}
  table.tbl tbody tr:hover{background:var(--surface-2);}
  .t-sub{font-size:11.5px;color:var(--ink-2);}

  /* pills */
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;line-height:1;
    padding:4px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap;}
  .pill .dot{width:6px;height:6px;border-radius:999px;flex:none;}
  .pill.good{background:var(--good-bg);color:var(--good-fg);} .pill.good .dot{background:var(--good-dot);}
  .pill.warn{background:var(--warn-bg);color:var(--warn-fg);} .pill.warn .dot{background:var(--warn-dot);}
  .pill.bad{background:var(--bad-bg);color:var(--bad-fg);}   .pill.bad .dot{background:var(--bad-dot);}
  .pill.info{background:var(--info-bg);color:var(--info-fg);} .pill.info .dot{background:var(--info-dot);}
  .pill.mut{background:var(--surface-3);color:var(--ink-2);}  .pill.mut .dot{background:var(--ink-3);}
  .pill.accent{background:var(--accent-soft);color:var(--accent-text);} .pill.accent .dot{background:var(--accent);}
  .pill.pop{background:var(--pop-soft);color:var(--pop);} .pill.pop .dot{background:var(--pop);}

  /* buttons */
  .btn{appearance:none;font:inherit;font-size:12px;font-weight:500;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--ink-2);padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap;
    transition:background .13s,border-color .13s,color .13s;}
  .btn:hover{background:var(--surface-3);color:var(--ink);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-ink);}
  .btn.sm{padding:5px 9px;font-size:11.5px;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .rowlink{background:none;border:0;font:inherit;color:var(--accent-text);font-weight:500;cursor:pointer;padding:0;}
  .rowlink:hover{text-decoration:underline;}

  /* forms */
  select,input[type=text],input[type=search]{
    font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
    border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:7px 11px;}
  select{cursor:pointer;padding-right:26px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent;}
  label.fld{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:10px;color:var(--ink-2);
    text-transform:uppercase;letter-spacing:.07em;font-weight:500;}
  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}

  /* metric / tile */
  .metric{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:16px;
    display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);}
  .metric .k{font-size:26px;font-weight:600;line-height:1;letter-spacing:-.022em;color:var(--ink);}
  button.metric{cursor:pointer;text-align:left;transition:border-color .13s,transform .05s;font:inherit;}
  button.metric:hover{border-color:var(--border-strong);}
  button.metric:active{transform:translateY(1px);}
  .track{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
  .track > i{display:block;height:100%;border-radius:999px;}

  /* source blocks */
  .sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;}
  .srcblock{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);padding:13px;}
  .srcblock h3{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:500;color:var(--accent-text);margin-bottom:9px;}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:12.5px;}
  .kv .k{color:var(--ink-2);} .kv .v{text-align:right;color:var(--ink);font-weight:500;}

  .halves{display:grid;grid-template-columns:1fr 1fr;}
  @media (max-width:720px){.halves{grid-template-columns:1fr;}}
  .halves > div{padding:16px 18px;}
  .halves > div:first-child{border-right:1px solid var(--border);}
  @media (max-width:720px){.halves > div:first-child{border-right:0;border-bottom:1px solid var(--border);}}
  .halves h3{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:500;color:var(--accent-text);margin-bottom:11px;}

  .compare .mark{font-weight:600;}
  .compare .yes{color:var(--good-fg);} .compare .part{color:var(--warn-fg);} .compare .no{color:var(--ink-3);}
  .compare .plat{background:var(--accent-soft);}
  .compare thead th.plat{color:var(--accent-text);}

  /* pick list */
  .picklist{display:flex;flex-direction:column;max-height:calc(100vh - 208px);min-height:300px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);}
  .scoreact{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:7px;
    box-shadow:var(--shadow-sm);text-align:left;font:inherit;cursor:pointer;transition:border-color .13s,transform .05s;width:100%;}
  .scoreact:hover{border-color:var(--accent);} .scoreact:active{transform:translateY(1px);}
  .scoreact .k{font-size:24px;font-weight:600;line-height:1;letter-spacing:-.022em;color:var(--ink);}
  .scoreact .cta{font-size:11px;font-weight:600;color:var(--accent-text);margin-top:2px;display:flex;align-items:center;gap:4px;}
  .pickitem{text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border);font:inherit;
    padding:11px 13px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--ink);transition:background .12s;}
  .pickitem:last-child{border-bottom:0;}
  .pickitem:hover{background:var(--surface-2);}
  .pickitem[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent);}

  /* misc */
  .avatar{width:38px;height:38px;border-radius:10px;background:var(--surface-3);color:var(--ink-2);
    display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;font-family:var(--mono);letter-spacing:-.02em;}
  .avatar.br{background:var(--accent-soft);color:var(--accent-text);}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;}
  .list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
  .list > .li{padding:11px 13px;border-bottom:1px solid var(--border);font-size:12.5px;}
  .list > .li:last-child{border-bottom:0;}
  .note{font-size:12px;color:var(--ink-2);}
  .warnnote{font-size:12px;color:var(--warn-fg);background:var(--warn-bg);border-radius:var(--radius-sm);padding:9px 12px;}
  .empty{text-align:center;padding:30px 20px;color:var(--ink-2);font-size:13px;}
  .foot-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--border);background:var(--surface-2);}
  .seg{display:inline-flex;background:var(--surface-3);border-radius:8px;padding:2px;gap:2px;}
  .seg button{font:inherit;font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:6px;color:var(--ink-2);border:0;background:none;cursor:pointer;}
  .seg button[data-on="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
  .stepper{display:inline-flex;gap:4px;}
  .stepper button{width:22px;height:22px;line-height:1;padding:0;font-size:13px;border-radius:6px;}
  .stepper button[data-step="-1"],.wstep button[data-d="-1"]{color:var(--info-dot);font-weight:700;}
  .stepper button[data-step="1"],.wstep button[data-d="1"]{color:var(--pop);font-weight:700;}
  .checkcell{width:34px;text-align:center;}

  /* feed */
  .feed{display:flex;flex-direction:column;}
  .feed-row{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px;align-items:flex-start;}
  .feed-row:last-child{border-bottom:0;}
  .feed-ic{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--surface-3);}
  .feed-ic svg{width:14px;height:14px;stroke:var(--ink-2);fill:none;}
  .feed-tt{color:var(--ink-3);font-size:11px;margin-top:2px;}

  /* modal */
  .modal-ov{position:fixed;inset:0;background:rgba(15,12,8,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px;overflow:auto;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.34);width:100%;max-width:440px;overflow:hidden;}
  .modal h3{padding:15px 18px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;}
  .modal .mbody{padding:18px;display:flex;flex-direction:column;gap:14px;font-size:13px;}
  .modal .mfoot{padding:13px 18px;border-top:1px solid var(--border);background:var(--surface-2);display:flex;justify-content:flex-end;gap:8px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field > span{font-family:var(--mono);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);}
  .field input,.field textarea,.field select{width:100%;font:inherit;font-size:13px;color:var(--ink);
    background:var(--surface);border:1px solid var(--border-strong);border-radius:7px;padding:8px 11px;}
  .field textarea{min-height:88px;resize:vertical;}
  .stars{display:flex;gap:5px;}
  .stars button{background:none;border:0;cursor:pointer;font-size:24px;line-height:1;color:var(--border-strong);padding:0;}
  .stars button.on{color:var(--brand);}

  .fab{position:fixed;right:20px;bottom:20px;z-index:55;display:flex;align-items:center;gap:8px;
    background:var(--ink);color:var(--surface);border:0;border-radius:999px;padding:10px 16px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .fab:hover{filter:brightness(1.12);}
  .fab svg{width:15px;height:15px;stroke:currentColor;fill:none;}

  .spark svg{display:block;width:100%;height:60px;}
  [hidden]{display:none!important;}
  .toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);color:var(--surface);
    font-size:12.5px;font-weight:500;padding:10px 16px;border-radius:9px;box-shadow:0 10px 34px rgba(0,0,0,.24);z-index:58;max-width:92vw;text-align:center;}

  /* advanced-capability marker — Cellcard secondary pink */
  .adv-tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;font-weight:500;
    text-transform:uppercase;letter-spacing:.06em;color:var(--pop);background:var(--pop-soft);
    padding:3px 8px;border-radius:999px;white-space:nowrap;}
  .adv-tag::before{content:"";width:5px;height:5px;border-radius:999px;background:var(--pop);flex:none;}
  .farrow{color:var(--info-dot);}

  /* flow board (How it works) */
  .board{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
    background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:18px 18px;background-position:-1px -1px;
    padding:20px;overflow-x:auto;}
  .flowrow{display:flex;align-items:stretch;gap:0;min-width:min-content;}
  .fnode{flex:none;width:172px;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;
    padding:12px 13px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:5px;}
  button.fnode{cursor:pointer;font:inherit;text-align:left;transition:border-color .13s,transform .05s;}
  button.fnode:hover{border-color:var(--accent);}
  button.fnode:active{transform:translateY(1px);}
  .fnode .fh{display:flex;align-items:center;gap:7px;}
  .fnode .fh svg{width:15px;height:15px;stroke:var(--accent-text);fill:none;flex:none;}
  .fnode .ft{font-weight:600;font-size:12px;line-height:1.25;}
  .fnode .fs{font-size:10.5px;color:var(--ink-2);line-height:1.4;}
  .fnode .fstep{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;}
  .farrow{flex:none;width:34px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);}
  .farrow svg{width:20px;height:14px;stroke:currentColor;fill:none;}
  .lane{display:flex;gap:14px;align-items:flex-start;}
  .lane-label{flex:none;width:120px;padding-top:10px;}
  .lane-label .ll-t{font-weight:600;font-size:12.5px;}
  .lane-label .ll-s{font-size:10.5px;color:var(--ink-2);margin-top:2px;}
  @media (max-width:720px){ .lane{flex-direction:column;} .lane-label{width:auto;padding-top:0;} }

  /* first-visit nav callout */
  .navtip{position:absolute;z-index:120;max-width:236px;background:var(--pop);color:#fff;font-size:12px;line-height:1.45;
    padding:10px 30px 10px 13px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:navtip-in .26s ease both;}
  .navtip-arrow{position:absolute;left:-6px;top:14px;width:12px;height:12px;background:var(--pop);transform:rotate(45deg);}
  .navtip-x{position:absolute;top:3px;right:6px;background:none;border:0;color:#fff;font-size:16px;line-height:1;cursor:pointer;opacity:.75;}
  .navtip-x:hover{opacity:1;}
  @keyframes navtip-in{from{opacity:0;transform:translateX(-7px);}to{opacity:1;transform:translateX(0);}}
  .welcome .lead{font-size:13.5px;color:var(--ink);margin:0 0 10px;line-height:1.5;}
  .welcome p{margin:0 0 10px;color:var(--ink-2);font-size:12.5px;line-height:1.55;}
  .welcome-steps{margin:12px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:7px;}
  .welcome-steps li{font-size:12px;color:var(--ink-2);line-height:1.5;}

  /* tour */
  .tour-target{outline:2px solid var(--accent)!important;outline-offset:3px;border-radius:8px;
    animation:tourpulse 1.5s ease-in-out infinite;}
  @keyframes tourpulse{0%,100%{box-shadow:0 0 0 0 rgba(245,99,0,.28);}50%{box-shadow:0 0 0 7px rgba(245,99,0,0);}}
  .tourdock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:57;width:440px;max-width:calc(100vw - 32px);
    background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 16px 44px rgba(0,0,0,.3);overflow:hidden;}
  .tourdock .td-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);}
  .tourdock .td-h .tt{font-weight:600;font-size:12.5px;}
  .tourdock .td-h .ts{font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.05em;}
  .tourdock .td-b{padding:13px 14px;font-size:12.5px;line-height:1.5;color:var(--ink);}
  .tourdock .td-f{display:flex;justify-content:space-between;gap:8px;padding:11px 14px;border-top:1px solid var(--border);}
  .tourdock .td-close{background:none;border:0;color:var(--ink-3);cursor:pointer;font:inherit;font-size:11.5px;padding:0;}
  .tourdock .td-close:hover{color:var(--ink);}
  @media (max-width:520px){ .tourdock{bottom:14px;} }

  /* rules & scoring */
  .field-row{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
  .field-row:last-child{border-bottom:0;}
  .field-row .fr-main{flex:1;min-width:0;}
  .field-row .fr-l{font-size:12.5px;font-weight:500;}
  .field-row .fr-n{font-size:10.5px;color:var(--ink-2);margin-top:2px;line-height:1.45;}
  .field-row .fr-meta{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .cov{height:4px;border-radius:999px;background:var(--surface-3);width:70px;overflow:hidden;flex:none;}
  .cov>i{display:block;height:100%;background:var(--info-dot);}
  .cov-t{font-family:var(--mono);font-size:9px;color:var(--ink-3);letter-spacing:.03em;}
  .wstep{display:inline-flex;align-items:stretch;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:var(--surface);flex:none;}
  .wstep button{width:28px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;font-size:15px;line-height:1;padding:0;}
  .wstep button:hover{background:var(--surface-3);}
  .wstep button[data-d="-1"]:hover{background:var(--info-bg);}
  .wstep button[data-d="1"]:hover{background:var(--pop-soft);}
  .wstep input{width:52px;border:0;text-align:center;font-family:var(--mono);font-size:12.5px;background:transparent;color:var(--ink);
    -moz-appearance:textfield;appearance:textfield;padding:6px 0;}
  .wstep input::-webkit-outer-spin-button,.wstep input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .wstep input:focus{outline:0;background:var(--accent-soft);}
  .wu{font-family:var(--mono);font-size:9px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;flex:none;width:58px;}
  .xbtn{width:26px;height:26px;flex:none;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1;}
  .xbtn:hover{color:var(--bad-fg);border-color:var(--bad-dot);background:var(--bad-bg);}
  .recstrip{display:flex;flex-wrap:wrap;gap:6px;}
  .recchip{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--pop);background:var(--pop-soft);color:var(--pop);
    font-size:11px;font-weight:500;padding:5px 9px;border-radius:999px;cursor:pointer;}
  .recchip:hover{filter:brightness(.97);}
  .recchip .rp{font-family:var(--mono);font-size:9.5px;opacity:.85;}
  .formula{font-family:var(--mono);font-size:10.5px;line-height:1.65;color:var(--ink-2);background:var(--surface-2);
    border:1px solid var(--border);border-radius:7px;padding:9px 11px;word-break:break-word;}
  .bd{border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:11.5px;}
  .bd .bdr{display:flex;justify-content:space-between;gap:10px;padding:7px 11px;border-bottom:1px solid var(--border);}
  .bd .bdr:last-child{border-bottom:0;}
  .bd .bdr.tot{font-weight:600;background:var(--surface-2);}
  .bd .bda{font-family:var(--mono);}

  /* end-goal / impact */
  .pillar{border:1px solid var(--border);border-radius:9px;padding:14px;background:var(--surface-2);}
  .pillar .ph{display:flex;align-items:center;gap:8px;}
  .pillar .pd{font-size:11.5px;color:var(--ink-2);margin-top:6px;line-height:1.55;}
  .chain{display:flex;flex-wrap:wrap;gap:6px 5px;align-items:center;font-size:11.5px;color:var(--ink-2);line-height:1.5;}
  .chain .ca{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);}
</style>
</head>

  Feedback
</button>

<div id="tourHost"></div>
<div id="modalHost"></div>

<script>
"use strict";

/* ======================================================= helpers */
function $(s,r){ return (r||document).querySelector(s); }
function elh(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function initials(name){ return name.split(/[\s&]+/).filter(Boolean).slice(0,2).map(function(w){return w[0];}).join("").toUpperCase(); }
function pill(t,l){ return '<span class="pill '+t+'"><span class="dot"></span>'+esc(l)+'</span>'; }
function fmtInt(n){ return n.toLocaleString("en-US"); }
function rel(ms){
  var d=Date.now()-ms; if(d<0) d=0;
  var s=Math.round(d/1000); if(s<45) return "just now";
  var m=Math.round(s/60); if(m<60) return m+"m ago";
  var h=Math.round(m/60); if(h<24) return h+"h ago";
  var dd=Math.round(h/24); if(dd<7) return dd+"d ago";
  return new Date(ms).toISOString().slice(0,10);
}
function hoursAgo(h){ return Date.now()-h*3600000; }
var toastTimer;
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.hidden=true;},3000); }
function parseTenure(s){ var y=(String(s).match(/(\d+)\s*y/)||[0,0])[1], m=(String(s).match(/(\d+)\s*m/)||[0,0])[1]; return (+y)*12+(+m); }

var SYSTEMS=["CRM","Billing","Network","Support","Digital"];
var SRC_SYS={
  CRM:{sys:"Siebel CRM",           what:"subscription & contact master"},
  Billing:{sys:"Kenan billing",    what:"charges, plan, payments"},
  Network:{sys:"Usage mediation",  what:"data sessions, cell, radio"},
  Support:{sys:"Freshdesk",        what:"tickets & interactions"},
  Digital:{sys:"MyCellcard app",   what:"logins & in-app activity"}
};
function srcOpco(c,sy){ return sy==="Network" ? "Telcotech" : (sy==="Billing" && c.opco==="EZECOM") ? "EZECOM" : (c.opco||"Cellcard"); }
function srcHeader(c,sy){ return esc(SRC_SYS[sy].sys)+' <span style="color:var(--ink-3)">&middot; '+esc(srcOpco(c,sy))+'</span>'; }
var CHURN_RISK=60;   /* kept in sync with config in recompute() */
var AUTO=0.90;
function BANDS(){ var t=STORE.get().config.thresholds; return {med:t.bandMedium, high:t.bandHigh}; }
function band(v){ var b=BANDS(); return v>=b.high?"High":v>=b.med?"Medium":"Low"; }
function churnTone(v){ var b=BANDS(); return v>=b.high?"bad":v>=b.med?"warn":"good"; }
function scoreTone(v){ var b=BANDS(); return v>=b.high?"good":v>=b.med?"warn":"mut"; }
function clampScore(v){ return Math.max(0,Math.min(100,Math.round(v))); }

/* --- plug-and-play scoring engine. Each score = base + Σ (field.raw(inputs) × weight).
       The library of available fields is FIELDLIB; the active set + weights live in STORE.config.scores. --- */
var FIELDLIB=[
  {key:"open_tickets",       label:"Open support tickets",          note:"Count of tickets currently in status Open",                    source:"Support",    coverage:100, unit:"/ ticket",    suggest:{churn:15},              raw:function(x){return x.open;}},
  {key:"idle_30d",           label:"No activity for 30+ days",       note:"Most recent event across any source is older than 30 days",     source:"All sources",coverage:100, unit:"points",      suggest:{churn:16},              raw:function(x){return x.idleDays>30?1:0;}},
  {key:"active_7d",          label:"Active within the last 7 days",  note:"Any event across any source in the past week",                  source:"All sources",coverage:100, unit:"points",      suggest:{engagement:12},         raw:function(x){return x.idleDays<=7?1:0;}},
  {key:"renewal_90d",        label:"Contract renews within 90 days", note:"Renewal date is 90 days out or less",                           source:"Billing",    coverage:92,  unit:"points",      suggest:{churn:15},              raw:function(x){return x.renewalDays<=90?1:0;}},
  {key:"consent_withdrawn",  label:"Marketing consent withdrawn",    note:"Customer has opted out of marketing",                           source:"CRM",        coverage:100, unit:"points",      suggest:{churn:12},              raw:function(x){return x.consentW?1:0;}},
  {key:"area_complaints",    label:"Network complaints in home area",note:"Complaints logged in the customer's home cell area",            source:"Network",    coverage:74,  unit:"/ complaint",suggest:{churn:10},              raw:function(x){return x.area;}},
  {key:"tenure_years",       label:"Years of tenure",               note:"Applied per year since the customer joined",                    source:"CRM",        coverage:100, unit:"/ year",     suggest:{churn:-2.5, upsell:3},  raw:function(x){return x.tenureYears;}},
  {key:"app_sessions",       label:"App sessions in last 30 days",   note:"App opens in the last 30 days, capped at 20",                   source:"Digital",    coverage:68,  unit:"/ session", suggest:{engagement:4},          raw:function(x){return Math.min(x.sessions,20);}},
  {key:"push_enabled",       label:"Push notifications enabled",     note:"Customer accepts push notifications",                           source:"Digital",    coverage:68,  unit:"points",      suggest:{engagement:12},         raw:function(x){return x.consentW?0:1;}},
  {key:"autopay",            label:"Autopay active",                 note:"Customer pays automatically",                                   source:"Billing",    coverage:88,  unit:"points",      suggest:{engagement:9},          raw:function(x){return 1;}},
  {key:"over_plan_usage",    label:"Usage over plan allowance",      note:"Data usage above 100% of the plan allowance",                   source:"Network",    coverage:74,  unit:"points",      suggest:{upsell:20},             raw:function(x){return x.usage>1?1:0;}},
  {key:"engagement_high",    label:"Engagement score is High",       note:"The engagement score is in the High band",                      source:"Derived",    coverage:100, unit:"points",      suggest:{upsell:16},             raw:function(x){return x.engHigh?1:0;}},
  {key:"not_top_tier",       label:"Not on the top plan tier",       note:"A higher tier exists to move the customer to",                  source:"Billing",    coverage:92,  unit:"points",      suggest:{upsell:14},             raw:function(x){return x.atTop?0:1;}},
  {key:"low_arpu",           label:"Low ARPU",                       note:"Monthly spend below the threshold",                             source:"Billing",    coverage:100, unit:"points",      suggest:{upsell:-8},             raw:function(x){return x.arpuLow?1:0;}},
  {key:"nps_detractor",      label:"NPS detractor (last survey)",    note:"Scored 0–6 on the most recent survey — strong churn signal, but only run on a sample", source:"Support", coverage:41, unit:"points", suggest:{churn:18}, raw:function(x){return x.npsDetractor?1:0;}},
  {key:"bill_shock",         label:"Bill up 20%+ month-on-month",    note:"This cycle's charge is at least 20% higher than last",           source:"Billing",    coverage:88,  unit:"points",      suggest:{churn:13},              raw:function(x){return x.billShock?1:0;}},
  {key:"roamed_recent",      label:"Roamed in the last 30 days",     note:"Any roaming session recently",                                  source:"Network",    coverage:33,  unit:"points",      suggest:{upsell:9},              raw:function(x){return x.roamed?1:0;}},
  {key:"made_referral",      label:"Made a referral",               note:"Referred at least one new customer through the app",            source:"Digital",    coverage:55,  unit:"points",      suggest:{engagement:10, churn:-6},raw:function(x){return x.referred?1:0;}}
];
var FIELD={}; FIELDLIB.forEach(function(f){ FIELD[f.key]=f; });

function scoreInputs(c, forScore){
  var x={
    open: c.tickets.filter(function(t){return t.status==="Open";}).length,
    idleDays: c.timeline.length ? Math.round((Date.now()-c.timeline[0].at)/86400000) : 60,
    tenureYears: (c.sig?c.sig.tenureMonths:parseTenure(c.tenure))/12,
    consentW: c.consent==="withdrawn",
    area: c.sig?c.sig.areaComplaints:0,
    sessions: c.sig?c.sig.sessions30d:6,
    renewalDays: c.sig?c.sig.renewalDays:120,
    usage: c.sig?c.sig.usageRatio:1,
    atTop: c.sig?c.sig.atTopTier:false,
    arpuLow: /^\$\s*[0-4](\.\d+)?$/.test(c.arpu),
    npsDetractor: c.sig?!!c.sig.npsDetractor:false,
    billShock: c.sig?!!c.sig.billShock:false,
    roamed: c.sig?!!c.sig.roamed:false,
    referred: c.sig?!!c.sig.referred:false
  };
  x.engHigh = forScore==="engagement" ? false : (evalScore(c,"engagement").value >= BANDS().high);
  return x;
}
function evalScore(c, key){
  var sc=STORE.get().config.scores[key], x=scoreInputs(c, key);
  var parts=[{l:"Base rate", a:sc.base, k:"__base"}];
  (sc.fields||[]).forEach(function(f){
    var def=FIELD[f.key]; if(!def) return;
    var rv=def.raw(x);
    var amt=Math.round(rv*f.weight*10)/10;
    if(amt===0 && rv===0) return;
    var lbl=def.label;
    if(def.unit.indexOf("/")===0 && rv>1) lbl=(Math.round(rv*10)/10)+" × "+def.label.toLowerCase();
    parts.push({l:lbl, a:amt, k:f.key});
  });
  var raw=parts.reduce(function(s,q){return s+q.a;},0);
  return {value:clampScore(raw), raw:Math.round(raw*10)/10, parts:parts};
}
function computeScore(c,key){ return evalScore(c,key).value; }
function computeDQ(list){
  var w=STORE.get().config.dq; if(!list.length) return 0;
  return clampScore(list.reduce(function(a,c){return a + w.base + c.sources.length*w.perSource;},0)/list.length);
}
function fieldCoverageWarn(key){ var d=FIELD[key]; return d && d.coverage<55; }
function recommendedFields(scoreKey){
  var active=(STORE.get().config.scores[scoreKey].fields||[]).map(function(f){return f.key;});
  return FIELDLIB.filter(function(f){ return f.suggest[scoreKey]!=null && active.indexOf(f.key)<0; });
}
function recompute(){
  var s=STORE.get();
  CHURN_RISK = s.config.thresholds.atRisk;
  AUTO = s.config.thresholds.autoMerge;
  s.customers.forEach(function(c){
    c.engagement=computeScore(c,"engagement");
    c.churn=computeScore(c,"churn");
    c.upsell=computeScore(c,"upsell");
  });
}

/* ======================================================= seed data */
function seed(){
  function C(id,name,seg,srcs,churn,upsell,eng,arpu,tenure,plan,consent,tin){
    var h4=id.charCodeAt(4), h5=id.charCodeAt(5), h6=id.charCodeAt(6);
    return {id:id,name:name,segment:seg,sources:srcs.slice(),churn:churn,upsell:upsell,engagement:eng,
      arpu:arpu,tenure:tenure,plan:plan,consent:consent,tin:tin||null,
      opco: /Fibre/.test(plan)?"EZECOM": /Loyalty/.test(plan)?"EngageX": seg==="B2B"?"Cellcard B2B":"Cellcard",
      dob:"1990-0"+((h4%9)+1)+"-1"+((h5%9)+1),
      email:(name.split(" ")[0].toLowerCase())+"."+(name.split(" ").slice(-1)[0].toLowerCase())+"@gmail.com",
      phone:"+855 "+(10+h4%80)+" "+(100+h5%800)+" "+(100+h6%800),
      natId:"09"+(10+h5%80)+"••••",

var STORE=(function(){
  var KEY="c360proto";
  var subs=[]; var state;
  function load(){
    try{ var s=JSON.parse(localStorage.getItem(KEY)); if(s && s.v===9) return s; }catch(e){}
    return seed();
  }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
  state=load();
  return {
    get:function(){ return state; },
    cust:function(id){ return state.customers.find(function(c){return c.id===id;}); },
    update:function(fn){ fn(state); save(); subs.forEach(function(f){f();}); },
    quiet:function(fn){ fn(state); save(); },
    subscribe:function(fn){ subs.push(fn); },
    log:function(kind,text,cust){ state.activity.unshift({at:Date.now(),kind:kind,text:text,cust:cust||null}); state.activity=state.activity.slice(0,80); },
    reset:function(){ try{localStorage.removeItem(KEY);}catch(e){} state=seed(); save(); subs.forEach(function(f){f();}); }
  };
})();

      (opts.submitLabel?'<button class="btn primary" data-x="ok" type="button">'+esc(opts.submitLabel)+'</button>':'')+
    '</div></div></div>');
  host.appendChild(ov);
  var settled=false;
  function close(viaSubmit){ ov.remove(); if(!viaSubmit && !settled && opts.onCancel) opts.onCancel(); settled=true; }
  ov.addEventListener("click",function(e){ if(e.target===ov) close(); });
  ov.querySelector('[data-x="cancel"]').addEventListener("click",function(){ close(); });
  var ok=ov.querySelector('[data-x="ok"]');
  if(ok) ok.addEventListener("click",function(){ if(opts.onSubmit && opts.onSubmit(ov)===false) return; settled=true; close(true); });
  document.addEventListener("keydown",function esc2(e){ if(e.key==="Escape"){ close(); document.removeEventListener("keydown",esc2); } });
  if(opts.onOpen) opts.onOpen(ov);
  var f=ov.querySelector("input,textarea,select"); if(f) f.focus();
  return {close:close,root:ov};
}

/* ======================================================= sparkline */
function sparkSVG(data,h){
  h=h||60; var w=280,pad=4;
  var mn=Math.min.apply(null,data),mx=Math.max.apply(null,data),rng=(mx-mn)||1;
  var pts=data.map(function(d,i){ return [pad+i*((w-2*pad)/(data.length-1)), h-pad-((d-mn)/rng)*(h-2*pad)]; });
  var line=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);}).join(" ");
  var area=line+" L "+(w-pad)+" "+(h-pad)+" L "+pad+" "+(h-pad)+" Z";
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="trend">'+
    '<path d="'+area+'" fill="var(--accent-soft)"></path>'+
    '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>'+
    '<circle cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+'" r="2.6" fill="var(--accent)"></circle></svg>';
}
/* distinct, realistic usage series per range — daily / weekly / monthly, different shapes */
function usageSeries(c, range){
  var daily=c.spark.reduce(function(a,b){return a+b;},0)/c.spark.length;   // ~GB per day
  var sd=c.id.charCodeAt(4)+c.id.charCodeAt(5)*3+c.id.charCodeAt(6)*7;
  function wob(i,amp){ return (Math.sin(sd*0.13 + i*1.15)*0.55 + Math.sin(sd*0.31 + i*0.47)*0.45) * amp; }
  var arr=[], n, unit, note, trend;
  if(range==="30d"){ n=30; unit="GB / day"; note="Last 30 days · daily";
    for(var i=0;i<n;i++) arr.push(Math.max(0.3, +(daily + wob(i, daily*0.4) - (i-15)*0.006*daily).toFixed(2))); }
  else if(range==="90d"){ n=13; unit="GB / week"; note="Last 90 days · weekly";
    for(var j=0;j<n;j++) arr.push(Math.max(2, +(daily*7*(0.92+j*0.012) + wob(j, daily*2.2)).toFixed(1))); }
  else { n=12; unit="GB / month"; note="Last 12 months · monthly";
    for(var k=0;k<n;k++) arr.push(Math.max(6, Math.round(daily*30*(0.62+k*0.035) + wob(k, daily*7)))); }
  var avg=arr.reduce(function(a,b){return a+b;},0)/arr.length;
  return { data:arr, unit:unit, note:note, avg:avg, peak:Math.max.apply(null,arr),
    delta: arr[arr.length-1]-arr[0] };
}
function fmtGB(v){ return v>=100 ? Math.round(v) : v>=10 ? v.toFixed(1) : v.toFixed(2); }

/* ======================================================= match actions */
function confirmMatch(mid){
  STORE.update(function(s){
    var m=s.matches.find(function(x){return x.id===mid;}); if(!m||m.state!=="pending") return;
    m.state="confirmed";
    var c=s.customers.find(function(x){return x.id===m.customerId;});
    if(c && c.sources.indexOf(m.sys)<0) c.sources.push(m.sys);
    if(c) c.timeline.unshift({at:Date.now(),src:m.sys,ev:"Record merged from "+m.label+" ("+m.signals.join(", ")+" match, "+m.score.toFixed(2)+")"});
    STORE.log("merge","Merged a "+m.sys+" record into "+(c?c.name:m.customerId)+" — now "+(c?c.sources.length:"?")+" of 5 systems",m.customerId);
  });
  var c=STORE.cust((STORE.get().matches.find(function(x){return x.id===mid;})||{}).customerId);
  toast("Merged — "+(c?c.name+" now has "+c.sources.length+" of 5 systems":"record merged"));
}
function setMatch(mid,state){
  STORE.update(function(s){
    var m=s.matches.find(function(x){return x.id===mid;}); if(!m) return;
    m.state=state;
    if(state==="rejected"){ var c=s.customers.find(function(x){return x.id===m.customerId;}); STORE.log("reject","Rejected a candidate "+m.sys+" record for "+(c?c.name:m.customerId),m.customerId); }
  });
}
function nudgeMatch(mid,d){
  STORE.update(function(s){
    var m=s.matches.find(function(x){return x.id===mid;}); if(!m||m.state!=="pending") return;
    m.score=Math.max(0.50,Math.min(0.99,Math.round((m.score+d)*100)/100));
  });
}

      '<div style="font-size:12.5px;margin:5px 0">Data merged from <b>'+c.sources.length+' of 5</b> source systems.</div>'+
      '<div class="chips">'+SYSTEMS.map(function(sy){ var has=c.sources.indexOf(sy)>=0; return '<span class="pill '+(has?"info":"mut")+'" style="opacity:'+(has?1:.55)+'">'+(has?'':'— ')+esc(sy)+'</span>'; }).join("")+'</div>'+
      (prov?'<div class="warnnote" style="margin-top:10px">Identity fields are <b>provisional</b> — '+pendingFor(c.id).length+' candidate record(s) still pending in <button class="rowlink" id="toId" type="button">Identity resolution</button>.</div>':'')+

  head.querySelector("#toOp").addEventListener("click",function(){ STORE.quiet(function(st){st.ui.opCustomerId=c.id;}); go("operator"); });

  main.appendChild(head);

  // sources grid — actual system + OpCo
  var dayAvg=(c.spark.reduce(function(a,b){return a+b;},0)/c.spark.length);
  var srcData={
    CRM:[["Segment",c.segment],["Customer since","joined "+c.tenure+" ago"],["Consent",c.consent==="granted"?"Marketing: granted":c.consent==="withdrawn"?"Marketing: withdrawn":"B2B agreement"],["Home area",c.cell]],
    Billing:[["Plan",c.plan],["ARPU",c.arpu+" / mo"],["Balance","Current"],["Payment","ABA autopay"]],
    Network:[["This cycle",Math.round(dayAvg*30)+" GB"],["Daily average",dayAvg.toFixed(1)+" GB"],["Home cell",c.cell],["Radio","4G / 5G"]],
    Support:[["Open tickets",String(c.tickets.filter(function(t){return t.status==="Open";}).length)],["Tickets (12 mo)",String(c.tickets.length)],["Last contact",c.timeline.length?rel(c.timeline[0].at):"—"]],
    Digital:[["Client","MyCellcard v6.2"],["Last opened",c.timeline.length?rel(c.timeline[0].at):"—"],["Push",c.consent==="withdrawn"?"Disabled":"Enabled"]]
  };
  var scard=elh('<div class="card"><div class="card-head"><div><h2>Profile by source</h2><p>Only the systems this customer is present in &mdash; system &middot; operating company</p></div></div><div class="card-body"><div class="sources"></div></div></div>');
  var sg=scard.querySelector(".sources");
  c.sources.forEach(function(sy){
    sg.appendChild(elh('<div class="srcblock"><h3>'+srcHeader(c,sy)+'</h3>'+
      '<div class="mini" style="margin:-4px 0 8px">'+esc(sy)+' &middot; '+esc(SRC_SYS[sy].what)+'</div>'+
      (srcData[sy]||[]).map(function(kv){return '<div class="kv"><span class="k">'+esc(kv[0])+'</span><span class="v">'+esc(kv[1])+'</span></div>';}).join("")+'</div>'));
  });
  main.appendChild(scard);

  // usage trend
  var g=elh('<div class="grid g2"></div>');
  var U=usageSeries(c, UI.c360_range);
  var uCard=elh('<div class="card"><div class="card-head"><div><h2>Usage trend</h2><p>'+srcHeader(c,"Network")+'</p></div>'+
    '<div class="seg" id="rangeSeg">'+["30d","90d","12m"].map(function(r){return '<button data-r="'+r+'" data-on="'+(UI.c360_range===r?"true":"false")+'" type="button">'+r+'</button>';}).join("")+'</div></div>'+
    '<div class="card-body"><div class="spark">'+sparkSVG(U.data,64)+'</div>'+
    '<div class="hrow mini" style="margin-top:10px"><span>avg '+fmtGB(U.avg)+' '+U.unit+'</span><span>peak '+fmtGB(U.peak)+' GB</span>'+
    '<span style="color:'+(U.delta>=0?"var(--good-fg)":"var(--bad-fg)")+'">'+(U.delta>=0?"▲":"▼")+' '+fmtGB(Math.abs(U.delta))+' vs start</span></div>'+
    '<div class="mini" style="margin-top:3px">'+esc(U.note)+'</div></div></div>');
  uCard.querySelectorAll("#rangeSeg button").forEach(function(b){ b.addEventListener("click",function(){ UI.c360_range=b.dataset.r; render(); }); });
  g.appendChild(uCard);

  // computed scores — clickable, route to next action
  var sc=elh('<div class="card" id="c360Scores"><div class="card-head"><div><h2>Computed scores</h2><p>Recalculated nightly &middot; click a score to act on it</p></div><span class="adv-tag">Per-customer</span></div>'+
    '<div class="card-body grid" style="grid-template-columns:1fr 1fr 1fr;gap:12px"></div></div>');
  var scb=sc.querySelector(".card-body");
  [["Churn risk",c.churn],["Upsell propensity",c.upsell],["Engagement",c.engagement]].forEach(function(r){
    scb.appendChild(scoreActNode(r[0], r[1], c));
  });
  g.appendChild(sc);
  main.appendChild(g);

  // tickets
  var tk=elh('<div class="card"><div class="card-head"><div><h2>Support tickets</h2><p>'+c.tickets.filter(function(t){return t.status==="Open";}).length+' open</p></div>'+
    '<button class="btn sm" id="newTix" type="button">+ New ticket</button></div><div class="card-body" style="display:flex;flex-direction:column;gap:8px"></div></div>');
  var tkb=tk.querySelector(".card-body");
  if(!c.tickets.length) tkb.appendChild(elh('<div class="empty">No tickets on file.</div>'));
  c.tickets.slice().sort(function(a,b){return b.opened-a.opened;}).forEach(function(t){
    var row=elh('<div class="hrow" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px">'+
      '<div><div style="font-size:12.5px">'+esc(t.subject)+'</div><div class="t-sub mono">'+esc(t.id)+' &middot; '+rel(t.opened)+'</div></div>'+
      '<div class="chips">'+pill(t.status==="Open"?"warn":"good",t.status)+(t.status==="Open"?'<button class="btn sm" data-res="'+t.id+'" type="button">Resolve</button>':'')+'</div></div>');
    var rb=row.querySelector("[data-res]");
    if(rb) rb.addEventListener("click",function(){
      STORE.update(function(st){ var cc=st.customers.find(function(x){return x.id===c.id;});
        var tt=cc.tickets.find(function(x){return x.id===t.id;}); tt.status="Resolved";
        cc.timeline.unshift({at:Date.now(),src:"Support",ev:"Ticket "+t.id+" resolved — "+t.subject});
        STORE.log("ticket","Resolved ticket "+t.id+" for "+cc.name,c.id); });
      toast("Ticket "+t.id+" resolved");
    });
    tkb.appendChild(row);
  });
  tk.querySelector("#newTix").addEventListener("click",function(){
    modal({title:"New ticket for "+c.name, submitLabel:"Create ticket",
      body:'<label class="field"><span>Subject</span><input id="fTix" type="text" placeholder="What’s the issue?"></label>',
      onSubmit:function(ov){
        var v=ov.querySelector("#fTix").value.trim(); if(!v) return false;
        STORE.update(function(st){ var cc=st.customers.find(function(x){return x.id===c.id;});
          var id="T-"+(88300+Math.floor(Math.random()*90));
          cc.tickets.unshift({id:id,subject:v,status:"Open",opened:Date.now()});
          cc.timeline.unshift({at:Date.now(),src:"Support",ev:"Ticket "+id+" raised — "+v});
          STORE.log("ticket","Opened ticket for "+cc.name+" — "+v,c.id); });
        toast("Ticket created");
      }});
  });
  main.appendChild(tk);

  // notes
  var nc=elh('<div class="card"><div class="card-head"><div><h2>Notes</h2><p>Internal, not customer-visible</p></div><button class="btn sm" id="newNote" type="button">+ Add note</button></div><div class="card-body" style="display:flex;flex-direction:column;gap:10px"></div></div>');
  var ncb=nc.querySelector(".card-body");
  if(!c.notes.length) ncb.appendChild(elh('<div class="empty">No notes yet.</div>'));
  c.notes.slice().sort(function(a,b){return b.at-a.at;}).forEach(function(n){
    ncb.appendChild(elh('<div style="font-size:12.5px"><div class="mini">'+esc(n.by)+' &middot; '+rel(n.at)+'</div><div style="margin-top:2px">'+esc(n.text)+'</div></div>'));
  });
  nc.querySelector("#newNote").addEventListener("click",function(){
    modal({title:"Add a note to "+c.name, submitLabel:"Save note",
      body:'<label class="field"><span>Note</span><textarea id="fNote" placeholder="Context for the next person…"></textarea></label>',
      onSubmit:function(ov){ var v=ov.querySelector("#fNote").value.trim(); if(!v) return false;
        STORE.update(function(st){ var cc=st.customers.find(function(x){return x.id===c.id;});
          cc.notes.unshift({at:Date.now(),by:"You",text:v});
          STORE.log("note","You added a note to "+cc.name,c.id); });
        toast("Note saved");
      }});
  });
  main.appendChild(nc);

  // timeline
  var tlc=elh('<div class="card" id="c360Timeline"><div class="card-head"><div><h2>Activity timeline</h2><p>Merged across every source, most recent first</p></div></div>'+
    '<div class="twrap"><table class="tbl"><thead><tr><th>When</th><th>Source</th><th>Event</th></tr></thead><tbody></tbody></table></div></div>');
  var srcTone={CRM:"info",Billing:"mut",Network:"good",Support:"warn",Digital:"info"};
  var tbb=tlc.querySelector("tbody");
  if(!c.timeline.length) tbb.appendChild(elh('<tr><td colspan="3"><div class="empty">No activity recorded.</div></td></tr>'));
  c.timeline.slice(0,14).forEach(function(e){
    tbb.appendChild(elh('<tr><td class="mono t-sub" style="white-space:nowrap">'+rel(e.at)+'</td><td><span class="pill '+(srcTone[e.src]||"mut")+' timeline-src" style="font-size:10px">'+esc(e.src)+'</span></td><td style="font-size:12.5px">'+esc(e.ev)+'</td></tr>'));
  });
  main.appendChild(tlc);

  wrap.appendChild(main);
  return wrap;
};

/* ======================================================= VIEW: OPERATOR */
VIEWS.operator=function(){
  var s=STORE.get();
  var wrap=elh('<div class="panel"></div>');
  wrap.appendChild(elh('<div class="panel-head"><p>Look up a customer, act on the merged view, then build and save an audience list for a campaign.</p></div>'));

  // controls
  var ctrl=elh('<div class="card"><div class="card-body controls">'+
    '<label class="fld">Source filter<select id="opSrc">'+["all"].concat(SYSTEMS).map(function(x){return '<option value="'+x+'"'+(UI.op_source===x?" selected":"")+'>'+(x==="all"?"All sources":x)+'</option>';}).join("")+'</select></label>'+
    '<label class="fld" style="flex:1;min-width:200px">Customer search<input type="search" id="opSearch" placeholder="Name or master ID…" value="'+esc(UI.op_q)+'"></label>'+
    '</div></div>');
  wrap.appendChild(ctrl);

  function inSrc(c){ return UI.op_source==="all" || c.sources.indexOf(UI.op_source)>=0; }
  var scoped=s.customers.filter(inSrc);
  var atRisk=scoped.filter(function(c){return c.churn>=CHURN_RISK;}).length;
  var cross=scoped.filter(function(c){return c.sources.length>=3;}).length;
  var dq=computeDQ(scoped);
  var k=elh('<div class="grid g3"></div>');
  [["At-risk customers",atRisk,"churn ≥ "+CHURN_RISK+" · "+(UI.op_source==="all"?"all sources":UI.op_source),"bad"],
   ["Well-reconciled",cross,"present in 3+ source systems",""],
   ["Data quality score",dq+"%",UI.op_source==="all"?"book average":UI.op_source+" records","g"]].forEach(function(t){
    k.appendChild(elh('<div class="metric"><div class="eyebrow">'+t[0]+'</div><div class="k num" style="'+(t[3]==="bad"?"color:var(--bad-fg)":t[3]==="g"?"color:var(--accent-text)":"")+'">'+t[1]+'</div><div class="note">'+t[2]+'</div></div>'));
  });
  wrap.appendChild(k);

  // picker + detail
  var sp=elh('<div class="split"></div>');
  var pick=elh('<div class="col-side"><div class="card"><div class="card-head"><div><h2>Customers</h2><p id="opPickCount"></p></div></div><div class="card-body" style="padding:12px"><div class="picklist" id="opPick"></div></div></div></div>');
  function fillPick(){
    var q=UI.op_q.toLowerCase();
    var list=scoped.filter(function(c){ return !q || c.name.toLowerCase().indexOf(q)>=0 || c.id.toLowerCase().indexOf(q)>=0; });
    pick.querySelector("#opPickCount").textContent=list.length+" of "+s.customers.length;
    var host=pick.querySelector("#opPick"); host.innerHTML="";
    if(!list.length){ host.appendChild(elh('<div class="empty">No match.</div>')); return; }
    if(!list.some(function(c){return c.id===s.ui.opCustomerId;})) STORE.quiet(function(st){ st.ui.opCustomerId=list[0].id; });
    list.forEach(function(c){
      host.appendChild(custRow(c,function(){ STORE.quiet(function(st){st.ui.opCustomerId=c.id;}); render(); }, c.id===STORE.get().ui.opCustomerId));
    });
  }
  fillPick();
  sp.appendChild(pick);

  var sel=STORE.cust(s.ui.opCustomerId)||scoped[0]||s.customers[0];
  var det=elh('<div class="col-main"><div class="card" id="opDetailCard">'+
    '<div class="card-head"><div><h2>'+esc(sel.name)+' <span class="adv-tag">One activation view</span></h2><p class="mono">'+esc(sel.id)+(sel.tin?' &middot; TIN '+esc(sel.tin):'')+'</p></div>'+pill(churnTone(sel.churn),sel.churn+" churn")+'</div>'+
    '<div class="halves">'+
      '<div><h3>Identity (single view)</h3>'+
        [["Master ID",sel.id],["Reconciliation",isProvisional(sel)?"Provisional — "+pendingFor(sel.id).length+" pending":sel.sources.length+" of 5 systems"],
         ["Business tax ID",sel.tin||"—"],["Consent",sel.consent==="granted"?"Marketing: granted":sel.consent==="withdrawn"?"Marketing: withdrawn":"B2B agreement"]]
         .map(function(kv){return '<div class="kv"><span class="k">'+esc(kv[0])+'</span><span class="v">'+esc(kv[1])+'</span></div>';}).join("")+
        '<div class="eyebrow" style="margin-top:10px">Linked sources</div><div class="chips" style="margin-top:5px">'+sel.sources.map(function(x){return '<span class="pill mut">'+esc(x)+'</span>';}).join("")+'</div></div>'+
      '<div><h3>Profile &amp; activity (360)</h3>'+
        [["Segment",sel.segment],["Plan",sel.plan],["ARPU",sel.arpu],["Tenure",sel.tenure],
         ["Open tickets",String(sel.tickets.filter(function(t){return t.status==="Open";}).length)],["Last activity",sel.timeline.length?rel(sel.timeline[0].at):"—"]]
         .map(function(kv){return '<div class="kv"><span class="k">'+esc(kv[0])+'</span><span class="v">'+esc(kv[1])+'</span></div>';}).join("")+
        '<div class="eyebrow" style="margin-top:10px">Churn risk</div><div class="hrow" style="gap:8px;margin-top:5px"><span class="num" style="font-size:13px;color:'+(sel.churn>=CHURN_RISK?"var(--bad-fg)":"var(--ink-2)")+'">'+sel.churn+'%</span><span class="track" style="flex:1"><i style="width:'+sel.churn+'%;background:'+(sel.churn>=CHURN_RISK?"var(--bad-dot)":sel.churn>=40?"var(--warn-dot)":"var(--good-dot)")+'"></i></span></div></div>'+
    '</div>'+
    '<div class="foot-row"><span class="note">Audience: '+(sel.churn>=CHURN_RISK?"win-back / retention":"engagement / upsell")+' &middot; resolved from '+sel.sources.length+' sources'+
      (sel.offers.length?' &middot; last offer: '+esc(sel.offers[0].type):'')+'</span>'+
      '<div class="btn-row"><button class="btn" id="toAud" type="button">Add to audience</button><button class="btn primary" id="sendOffer" type="button">Send offer</button>'+
      '<button class="btn" id="op360" type="button">View full 360</button></div></div></div></div>');
  det.querySelector("#op360").addEventListener("click",function(){ openCustomer(sel.id); });
  det.querySelector("#sendOffer").addEventListener("click",function(){ openOfferModal(sel); });
  det.querySelector("#toAud").addEventListener("click",function(){ openAudienceModal(sel); });
  sp.appendChild(det);
  wrap.appendChild(sp);

  /* arrived here from a Customer 360 score card — open the matching next step */
  if(UI.opPrefill){
    var k=UI.opPrefill; UI.opPrefill=null;
    setTimeout(function(){
      if(k==="winback") openOfferModal(sel,"Win-back credit");
      else if(k==="upsell") openOfferModal(sel,"Upsell — next plan tier");
      else openAudienceModal(sel);
    },40);
  }

  // build a list
  var bl=elh('<div class="card" id="blCard"><div class="card-head"><div><h2>Build a list</h2><p>Filter the base, tick who you want, then save it as an audience</p></div></div>'+
    '<div class="card-body controls">'+
    '<label class="fld">Segment<select id="blSeg">'+["all","Consumer postpaid","Consumer prepaid","B2B","Loyalty"].map(function(x){return '<option'+(UI.bl.seg===x?" selected":"")+'>'+(x==="all"?"All segments":x)+'</option>';}).join("")+'</select></label>'+
    '<label class="fld">Source<select id="blSrc">'+["any"].concat(SYSTEMS).map(function(x){return '<option'+(UI.bl.src===x?" selected":"")+'>'+(x==="any"?"Any source":x)+'</option>';}).join("")+'</select></label>'+
    '<label class="fld">Min churn<select id="blMin">'+[0,40,50,60,70].map(function(x){return '<option value="'+x+'"'+(UI.bl.minChurn===x?" selected":"")+'>'+(x===0?"any":x+"+")+'</option>';}).join("")+'</select></label>'+
    '<label class="fld">Sort by<select id="blSort">'+[["churn","Churn (high→low)"],["upsell","Upsell (high→low)"],["engagement","Engagement (high→low)"],["name","Name (A→Z)"]].map(function(o){return '<option value="'+o[0]+'"'+(UI.bl.sort===o[0]?" selected":"")+'>'+o[1]+'</option>';}).join("")+'</select></label>'+
    '</div>'+
    '<div class="twrap"><table class="tbl"><thead><tr><th class="checkcell"><input type="checkbox" id="blAll" aria-label="all"></th><th>Customer</th><th>Segment</th><th>Churn</th><th>Upsell</th><th>ARPU</th><th>Sources</th></tr></thead><tbody id="blBody"></tbody></table></div>'+
    '<div class="foot-row"><span class="note" id="blCount"></span><div class="btn-row"><button class="btn" id="blClear" type="button">Clear selection</button><button class="btn primary" id="blSave" type="button">Save as audience</button></div></div></div>');

  function blList(){
    var l=s.customers.slice();
    if(UI.bl.seg!=="all") l=l.filter(function(c){return c.segment===UI.bl.seg;});
    if(UI.bl.src!=="any") l=l.filter(function(c){return c.sources.indexOf(UI.bl.src)>=0;});
    if(UI.bl.minChurn) l=l.filter(function(c){return c.churn>=UI.bl.minChurn;});
    l.sort(function(a,b){ return UI.bl.sort==="name" ? a.name.localeCompare(b.name) : b[UI.bl.sort]-a[UI.bl.sort]; });
    return l;
  }
  function fillBl(){
    var l=blList(); var body=bl.querySelector("#blBody"); body.innerHTML="";
    l.forEach(function(c){
      var tr=elh('<tr><td class="checkcell"><input type="checkbox" data-id="'+c.id+'"'+(UI.bl.picked[c.id]?" checked":"")+'></td>'+
        '<td><button class="rowlink" data-open="'+c.id+'">'+esc(c.name)+'</button><div class="t-sub mono">'+esc(c.id)+'</div></td>'+
        '<td>'+esc(c.segment)+'</td><td>'+pill(churnTone(c.churn),String(c.churn))+'</td><td>'+pill(scoreTone(c.upsell),String(c.upsell))+'</td>'+
        '<td class="mono">'+esc(c.arpu)+'</td><td class="t-sub">'+c.sources.length+' &middot; '+esc(c.sources.join(", "))+'</td></tr>');
      tr.querySelector("[data-open]").addEventListener("click",function(){ openCustomer(c.id); });
      tr.querySelector("input").addEventListener("change",function(e){ UI.bl.picked[c.id]=e.target.checked; countBl(); });
      body.appendChild(tr);
    });
    countBl();
  }
  function countBl(){
    var l=blList(); var n=l.filter(function(c){return UI.bl.picked[c.id];}).length;
    bl.querySelector("#blCount").textContent=l.length+" match · "+n+" selected";
    bl.querySelector("#blAll").checked=l.length>0 && n===l.length;
    bl.querySelector("#blSave").disabled=n===0;
  }
  ["blSeg","blSrc","blMin","blSort"].forEach(function(id){
    bl.querySelector("#"+id).addEventListener("change",function(e){
      if(id==="blSeg") UI.bl.seg=e.target.value; if(id==="blSrc") UI.bl.src=e.target.value;
      if(id==="blMin") UI.bl.minChurn=+e.target.value; if(id==="blSort") UI.bl.sort=e.target.value;
      fillBl();
    });
  });
  bl.querySelector("#blAll").addEventListener("change",function(e){ blList().forEach(function(c){ UI.bl.picked[c.id]=e.target.checked; }); fillBl(); });
  bl.querySelector("#blClear").addEventListener("click",function(){ UI.bl.picked={}; fillBl(); });
  bl.querySelector("#blSave").addEventListener("click",function(){
    var picked=blList().filter(function(c){return UI.bl.picked[c.id];});
    modal({title:"Save audience", submitLabel:"Save ("+picked.length+" customers)",
      body:'<label class="field"><span>Audience name</span><input id="fAudName" type="text" placeholder="e.g. Q3 postpaid win-back"></label>'+
        '<div class="note">'+picked.length+' selected customers, filtered by '+(UI.bl.seg==="all"?"all segments":UI.bl.seg)+
        (UI.bl.minChurn?', churn '+UI.bl.minChurn+'+':'')+'.</div>',
      onSubmit:function(ov){
        var nm=ov.querySelector("#fAudName").value.trim(); if(!nm) return false;
        STORE.update(function(st){
          st.audiences.push({id:"AUD-"+(10+st.audiences.length),name:nm,createdAt:Date.now(),
            rule:{segment:UI.bl.seg,source:UI.bl.src,minChurn:UI.bl.minChurn,sortBy:UI.bl.sort},
            memberIds:picked.map(function(c){return c.id;}), mapping:defaultMapping(), syncMode:"live", exports:[]});
          STORE.log("audience","Saved audience “"+nm+"” — "+picked.length+" customers");
        });
        UI.bl.picked={};
        toast("Audience saved — open List sync to map & export");
      }});
  });
  fillBl();
  wrap.appendChild(bl);

  // existing audiences
  var al=elh('<div class="card"><div class="card-head"><div><h2>Saved audiences</h2><p>Built here, synced in List sync</p></div></div><div class="card-body" style="display:flex;flex-direction:column;gap:8px"></div></div>');
  var alb=al.querySelector(".card-body");
  if(!s.audiences.length) alb.appendChild(elh('<div class="empty">None yet — build one above.</div>'));
  s.audiences.forEach(function(a){
    var row=elh('<div class="hrow" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:11px 13px">'+
      '<div><div style="font-weight:600;font-size:12.5px">'+esc(a.name)+'</div><div class="t-sub mono">'+esc(a.id)+' &middot; '+a.memberIds.length+' members &middot; '+a.exports.length+' exports</div></div>'+
      '<button class="btn sm" data-a="'+a.id+'" type="button">Open in List sync &rarr;</button></div>');
    row.querySelector("button").addEventListener("click",function(){ STORE.quiet(function(st){st.ui.syncAudienceId=a.id;}); go("listsync"); });
    alb.appendChild(row);
  });

var TOUR=null;
function startTour(id){ TOUR={id:id,i:0}; applyTourStep(); }
function endTour(done){
  TOUR=null;
  document.querySelectorAll(".tour-target").forEach(function(el){ el.classList.remove("tour-target"); });
  renderTourDock();
  if(done) toast("Tour complete — try another from How it works");
}
function tourCtx(){ var t=TOURS.find(function(x){return x.id===TOUR.id;}); return {t:t, s:t.steps[TOUR.i]}; }
function applyTourStep(){
  var c=tourCtx();
  if(active!==c.s.v) go(c.s.v,{keepScroll:true}); else render();
}
function tourNext(){ var c=tourCtx(); if(TOUR.i>=c.t.steps.length-1) endTour(true); else { TOUR.i++; applyTourStep(); } }
function tourPrev(){ if(TOUR.i>0){ TOUR.i--; applyTourStep(); } }
function applyTourHighlight(){
  document.querySelectorAll(".tour-target").forEach(function(el){ el.classList.remove("tour-target"); });
  if(!TOUR) return;
  var sel=tourCtx().s.sel; if(!sel) return;
  var el=document.querySelector(sel);
  if(el){ el.classList.add("tour-target"); try{ el.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){} }
}
function renderTourDock(){
  var host=$("#tourHost"); host.innerHTML="";

    '<div class="td-h"><span class="tt">'+esc(c.t.title)+'</span><span class="ts">STEP '+(TOUR.i+1)+' / '+n+'</span></div>'+
    '<div class="td-b">'+c.s.t+'</div>'+
    '<div class="td-f"><button class="td-close" type="button">Exit tour</button>'+
      '<span class="btn-row">'+(TOUR.i>0?'<button class="btn sm" data-x="prev" type="button">Back</button>':'')+
      '<button class="btn sm primary" data-x="next" type="button">'+(TOUR.i>=n-1?"Finish":"Next")+'</button></span></div></div>');
  d.querySelector(".td-close").addEventListener("click",function(){ endTour(false); });
  var p=d.querySelector('[data-x="prev"]'); if(p) p.addEventListener("click",tourPrev);

}

/* ======================================================= VIEW: RULES & SCORING */
var SCOREMETA={
  churn:{title:"Churn risk", tail:"higher = more likely to leave", pill:function(v){return pill(churnTone(v),v+" · "+band(v));}},
  engagement:{title:"Engagement", tail:"higher = more engaged", pill:function(v){return '<span class="pill info"><span class="dot"></span>'+v+' · '+band(v)+'</span>';}},
  upsell:{title:"Upsell propensity", tail:"higher = more likely to take more", pill:function(v){return '<span class="pill pop"><span class="dot"></span>'+v+' · '+band(v)+'</span>';}}
};
function scoreFormula(key){
  var sc=STORE.get().config.scores[key];
  var terms=[String(sc.base)];
  (sc.fields||[]).forEach(function(f){ var d=FIELD[f.key]; if(!d) return;
    terms.push(d.unit.indexOf("/")===0 ? f.key+"&times;"+f.weight : "("+f.key+" ? "+f.weight+" : 0)"); });
  return "score = clamp( "+terms.join(" + ").replace(/\+ \(/g,"+ (")+" , 0, 100 )";
}
function specJSON(){
  var c=STORE.get().config, out={
    spec_version:"1.1", generated:new Date().toISOString(),
    thresholds:{ at_risk_churn:c.thresholds.atRisk, auto_merge_confidence:c.thresholds.autoMerge,
      well_reconciled_min_sources:c.thresholds.wellReconciled, score_band_medium:c.thresholds.bandMedium, score_band_high:c.thresholds.bandHigh },
    scores:{}
  };
  ["churn","engagement","upsell"].forEach(function(k){
    var sc=c.scores[k];
    out.scores[ {churn:"churn_risk",engagement:"engagement",upsell:"upsell_propensity"}[k] ]={
      description:"0–100. "+SCOREMETA[k].tail+". Recomputed nightly.",
      formula:scoreFormula(k).replace(/&times;/g,"*").replace(/&[a-z]+;/g,""),
      base:sc.base,
      fields:(sc.fields||[]).map(function(f){ var d=FIELD[f.key]||{}; return {
        field:f.key, weight:f.weight, input:d.note, source:d.source, coverage_pct:d.coverage }; })
    };
  });
  out.scores.data_quality={ description:"0–100, per customer, averaged for a book of business.",
    formula:"clamp( avg_over_customers( "+c.dq.base+" + reconciled_sources * "+c.dq.perSource+" ), 0, 100 )",
    weights:c.dq, inputs:{ reconciled_sources:"number of source systems merged into the profile" } };
  out.scores.match_confidence={ description:"0.00–0.99. Confirm-to-merge threshold is auto_merge_confidence.",
    formula:"min( "+c.match.base+" + (name?"+c.match.name+":0) + (phone?"+c.match.phone+":0) + (email?"+c.match.email+":0) + (tax_id?"+c.match.taxId+":0), 0.99 )",
    weights:c.match, inputs:{ signals:"which of name / phone / email / tax_id matched between the two records" } };
  return out;
}
function copyJSON(obj,label){
  try{ navigator.clipboard.writeText(JSON.stringify(obj,null,2)); }catch(e){}
  toast((label||"Spec")+" copied to clipboard");
}
function wstepEl(value, step, onChange){
  var node=elh('<span class="wstep"><button type="button" data-d="-1">&minus;</button>'+
    '<input type="number" value="'+value+'" step="'+step+'"><button type="button" data-d="1">+</button></span>');
  var inp=node.querySelector("input"), dp=step<1?2:1;
  function set(v){ v=+(Math.round(v/step)*step).toFixed(dp); inp.value=v; onChange(v); }
  node.querySelectorAll("button").forEach(function(b){ b.addEventListener("click",function(){ set((parseFloat(inp.value)||0)+parseInt(b.dataset.d,10)*step); }); });
  inp.addEventListener("change",function(){ var v=parseFloat(inp.value); if(isNaN(v)){ inp.value=value; return; } set(v); });
  return node;
}

  dqc.querySelector("#cpDq").addEventListener("click",function(){ copyJSON(specJSON().scores.data_quality,"Data quality rule"); });
  [["base","Base rate per record","Value for a customer present in one source system",1],
   ["perSource","Per source system reconciled","Added for each system merged into the profile",1]
  ].forEach(function(r){
    var row=elh('<div class="field-row"><div class="fr-main"><div class="fr-l">'+r[1]+'</div><div class="fr-n">'+r[2]+'</div></div></div>');
    row.appendChild(wstepEl(cfg.dq[r[0]], r[3], function(v){ STORE.update(function(st){ st.config.dq[r[0]]=v; }); toast("Recalculated"); }));
    dqc.querySelector(".card-body").appendChild(row);
  });
  dqc.querySelector(".card-body").appendChild(elh('<div class="formula" style="margin-top:12px">score = clamp( avg over customers( '+cfg.dq.base+' + reconciled_sources &times; '+cfg.dq.perSource+' ), 0, 100 )</div>'));
  wrap.appendChild(dqc);

  /* match confidence */
  var mc=cfg.match, mcMax=Math.min(0.99, mc.base+mc.name+mc.phone+mc.email+mc.taxId);
  var mcc=elh('<div class="card"><div class="card-head"><div><h2>Match confidence</h2><p>How the 0.xx on the identity queue is composed &middot; capped at 0.99</p></div><button class="btn sm" id="cpMc" type="button">Copy rule (JSON)</button></div><div class="card-body"></div></div>');
  mcc.querySelector("#cpMc").addEventListener("click",function(){ copyJSON(specJSON().scores.match_confidence,"Match confidence rule"); });
  [["base","Base score","Confidence before any signal matches"],["name","Name matches (fuzzy)","Added when the names match"],
   ["phone","Phone matches exactly","Added when phone numbers match"],["email","Email matches","Added when emails match"],
   ["taxId","Tax-ID matches","The strongest signal — added when the registered tax ID matches"]
  ].forEach(function(r){
    var row=elh('<div class="field-row"><div class="fr-main"><div class="fr-l">'+r[1]+'</div><div class="fr-n">'+r[2]+'</div></div></div>');
    row.appendChild(wstepEl(mc[r[0]], 0.01, function(v){ STORE.update(function(st){ st.config.match[r[0]]=v; }); toast("Recalculated"); }));
    mcc.querySelector(".card-body").appendChild(row);
  });
  mcc.querySelector(".card-body").appendChild(elh('<div class="formula" style="margin-top:12px">confidence = min( '+mc.base+' + (name?'+mc.name+':0) + (phone?'+mc.phone+':0) + (email?'+mc.email+':0) + (tax_id?'+mc.taxId+':0), 0.99 )<br>all signals matched &rarr; '+mcMax.toFixed(2)+'</div>'));
  wrap.appendChild(mcc);

  wrap.appendChild(elh('<div class="warnnote">Nothing here is code — it is configuration. Whatever you set, every screen recalculates the same way engineering’s build should. <b>Export full build spec</b> hands them the formulas, the active fields, the weights and each input’s definition and coverage.</div>'));
  return wrap;
};

/* ======================================================= feedback */
function feedbackModal(){
  var screen=NAV.find(function(n){return n.id===active;}).title;
  var rating=0;
  modal({title:"Share feedback", submitLabel:"Send feedback",
    body:'<label class="field"><span>Which screen?</span><input id="fbScreen" type="text" value="'+esc(screen)+'"></label>'+
      '<div class="field"><span>How’s this working for you?</span><div class="stars" id="fbStars">'+[1,2,3,4,5].map(function(i){return '<button type="button" data-v="'+i+'">☆</button>';}).join("")+'</div></div>'+
      '<label class="field"><span>What’s on your mind?</span><textarea id="fbText" placeholder="What worked, what didn’t, what’s missing, what’s confusing…"></textarea></label>'+
      '<label class="field"><span>Your name (optional)</span><input id="fbName" type="text" placeholder=""></label>',
    onOpen:function(ov){
      ov.querySelectorAll("#fbStars button").forEach(function(b){
        b.addEventListener("click",function(){ rating=+b.dataset.v;
          ov.querySelectorAll("#fbStars button").forEach(function(x){ var on=+x.dataset.v<=rating; x.textContent=on?"★":"☆"; x.classList.toggle("on",on); });
        });
      });
    },
    onSubmit:function(ov){
      var text=ov.querySelector("#fbText").value.trim();
      if(!text && !rating) return false;
      STORE.update(function(st){
        st.feedback.push({at:Date.now(),screen:ov.querySelector("#fbScreen").value.trim()||screen,rating:rating||3,text:text,author:ov.querySelector("#fbName").value.trim()});
        STORE.log("feedback","Feedback left on "+screen);
      });
      toast("Thanks — noted");
    }});
}

/* ======================================================= theme */
(function theme(){
  var root=document.documentElement, btn=$("#themeToggle");
  var saved=STORE.get().ui.theme;
  if(saved==="light"||saved==="dark") root.setAttribute("data-theme",saved);
  function cur(){ return root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); }
  function paint(){ btn.innerHTML = cur()==="dark" ? "☾ Dark" : "☀ Light"; }
  btn.addEventListener("click",function(){
    var n = cur()==="dark" ? "light" : "dark";
    root.setAttribute("data-theme",n);
    STORE.update(function(st){ st.ui.theme=n; });
    paint();
  });
  try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paint); }catch(e){}
  paint();
})();

/* ======================================================= first-visit guide */
function navTip(navId, text){
  document.querySelectorAll(".navtip").forEach(function(n){ n.remove(); });
  var btn=document.querySelector('.side-nav .nav-btn[data-id="'+navId+'"]')
       || document.querySelector('.nav-btn[data-id="'+navId+'"]');
  if(!btn) return;
  btn.classList.add("tour-target");
  var tip=elh('<div class="navtip"><span class="navtip-arrow"></span><span class="navtip-t"></span>'+
    '<button type="button" class="navtip-x" aria-label="dismiss">&times;</button></div>');
  tip.querySelector(".navtip-t").textContent=text;
  document.body.appendChild(tip);
  var r=btn.getBoundingClientRect(), narrow=window.innerWidth<960;
  if(narrow){
    tip.style.left=(window.scrollX + Math.max(12, r.left))+"px";
    tip.style.top=(window.scrollY + r.bottom + 12)+"px";
    tip.querySelector(".navtip-arrow").style.cssText="left:18px;top:-6px;";
  } else {
    tip.style.left=(window.scrollX + r.right + 14)+"px";
    tip.style.top=(window.scrollY + r.top + Math.max(0,(r.height-38)/2))+"px";
  }
  var t;
  function kill(){ if(tip.parentNode) tip.remove(); btn.classList.remove("tour-target"); clearTimeout(t); }
  tip.querySelector(".navtip-x").addEventListener("click",kill);
  btn.addEventListener("click",kill,{once:true});
  t=setTimeout(kill,9000);
}
